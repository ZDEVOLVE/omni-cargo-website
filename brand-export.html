<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,800&family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;background:#0A1626;font-family:'IBM Plex Sans',sans-serif}
  body.light{background:#FFFFFF}
  /* lockup */
  .lockup{display:flex;align-items:center;gap:4.2vw}
  .lockup svg{width:17vw;height:17vw}
  .wm{font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:11.4vw;letter-spacing:.01em;line-height:.95;color:#EEF3F9}
  .wm small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:4.05vw;letter-spacing:.4em;color:#8CA3BC;margin-top:1vw}
  body.light .wm{color:#0A1626}
  body.light .wm small{color:#4A607A}
  /* symbol only */
  .symbol svg{width:62vmin;height:62vmin;display:block}
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'navy-lockup';
  const ring = c => `
    <path d="M 52.67 24.48 A 22 22 0 1 1 39.52 11.33" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
    <path d="M 20 41.5 C 31 49.5, 46 19.5, 53 12" stroke="#FF6B1A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 58.1 6.9 L 56.5 14.5 L 50.5 8.5 Z" fill="#FF6B1A"/>`;
  const light = v.startsWith('white');
  if (light) document.body.classList.add('light');
  const strokeC = light ? '#0A1626' : '#EEF3F9';
  const stage = document.getElementById('stage');
  if (v.endsWith('lockup')) {
    stage.innerHTML = `<div class="lockup">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">${ring(strokeC)}</svg>
      <div class="wm">OMNI<small>CARGO</small></div>
    </div>`;
  } else {
    stage.innerHTML = `<div class="symbol"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">${ring(strokeC)}</svg></div>`;
  }
</script>
</body>
</html>
