<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal — Omni Cargo</title>
<meta name="description" content="Track your Omni Cargo booking. Customers sign in with their access code; admins manage all bookings and quotes.">
<link rel="canonical" href="https://omnicargo.co.ke/portal.html">
<meta name="theme-color" content="#0A1626">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,700;10..72,800;10..72,900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#0A1626;--surface-2:#0F2035;--elevated:#142A44;--elevated-hi:#1B3554;
  --accent:#FF6B1A;--accent-2:#FFB347;--accent-soft:rgba(255,107,26,.16);--accent-glow:0 0 28px rgba(255,107,26,.45);
  --text:#EEF3F9;--text-mute:#8CA3BC;--text-faint:#5D7590;
  --hairline:rgba(238,243,249,.08);--hairline-hi:rgba(238,243,249,.18);
  --shadow-card:0 12px 40px rgba(3,8,16,.5);--shadow-cta:0 8px 28px rgba(255,107,26,.35);--whatsapp:#25D366;
  --pad:clamp(20px,5vw,72px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--surface);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#081020}
h1,h2,h3{font-family:'Big Shoulders',sans-serif;text-transform:uppercase;font-weight:800}
h1 em{font-style:normal;color:var(--accent)}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);flex:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 15px/1 'IBM Plex Sans',sans-serif;padding:14px 26px;border-radius:999px;cursor:pointer;border:0;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s ease,border-color .2s,color .2s,background-color .2s}
.btn-primary{background:var(--accent);color:#081020;box-shadow:var(--shadow-cta)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{border:1px solid var(--hairline-hi);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:9px 16px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,22,38,.72);border-bottom:1px solid var(--hairline)}
.nav-inner{max-width:1320px;margin:0 auto;padding:0 var(--pad);height:74px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:34px;height:34px}
.brand .wm{font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:23px;letter-spacing:.02em;line-height:1}
.brand .wm small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.34em;color:var(--text-mute);margin-top:2px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.nav-right a{font:500 14.5px 'IBM Plex Sans',sans-serif;color:var(--text-mute)}
.nav-right a:hover{color:var(--text)}

main{padding-top:110px;padding-bottom:80px;min-height:100vh}

/* auth */
.auth{max-width:440px;margin:4vh auto 0;background:var(--elevated);border:1px solid var(--hairline);border-radius:22px;padding:clamp(28px,4vw,44px);box-shadow:var(--shadow-card)}
.auth h1{font-size:clamp(26px,4vw,34px);line-height:1;margin:14px 0 8px}
.auth .sub{color:var(--text-mute);font-size:14.5px;margin-bottom:24px}
.f-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mute);margin:0 0 9px}
.f-in{width:100%;font:400 16px 'IBM Plex Sans',sans-serif;color:var(--text);background:var(--surface-2);border:1px solid var(--hairline-hi);border-radius:12px;padding:15px 18px;transition:border-color .2s,box-shadow .2s}
.f-in.code{font-family:'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;text-align:center;font-size:20px}
.f-in:focus{outline:none;border-color:var(--accent);box-shadow:var(--accent-glow)}
.err{color:#FF6B6B;font-size:13.5px;margin-top:12px;display:none}
.hint{color:var(--text-faint);font-size:13px;margin-top:16px;line-height:1.6}

/* dashboard */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head h1{font-size:clamp(30px,5vw,48px);line-height:.95}
.head .who{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.grid{display:grid;gap:14px}
.card{background:var(--elevated);border:1px solid var(--hairline);border-radius:16px;padding:20px 22px}
.job{cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .2s}
.job:hover{transform:translateY(-2px);border-color:var(--hairline-hi)}
.job .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.job .ref{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.05em}
.job .rt{font-weight:600;font-size:15.5px}
.job .meta{color:var(--text-mute);font-size:13.5px;display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.job .meta .m{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-faint)}
.empty{color:var(--text-faint);font-size:14.5px;padding:34px;text-align:center;border:1px dashed var(--hairline-hi);border-radius:16px}

.chip{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;white-space:nowrap;display:inline-block}
.c-booked{background:var(--hairline);color:var(--text-mute)}
.c-move{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#081020}
.c-soft{background:var(--accent-soft);color:var(--accent)}
.c-done{background:rgba(37,211,102,.15);color:var(--whatsapp)}
.c-cancel{background:rgba(255,77,77,.15);color:#FF6B6B}
.c-quote{background:rgba(255,179,71,.14);color:var(--accent-2)}

.back{display:inline-flex;align-items:center;gap:8px;color:var(--text-mute);font:500 14px 'IBM Plex Sans',sans-serif;background:none;border:0;cursor:pointer;margin-bottom:18px}
.back:hover{color:var(--accent)}
.hero{background:linear-gradient(160deg,var(--elevated),var(--surface-2));border:1px solid var(--hairline);border-radius:20px;padding:clamp(22px,3.5vw,36px);box-shadow:var(--shadow-card);margin-bottom:20px}
.hero .ref{font-family:'IBM Plex Mono',monospace;font-size:clamp(20px,3.5vw,30px);color:var(--accent);letter-spacing:.04em}
.hero .route{font-family:'Big Shoulders',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(22px,3vw,32px);margin:4px 0 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:20px;border-top:1px dashed var(--hairline-hi);padding-top:18px}
.kv div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.kv div b{font-weight:500;font-size:15px}
.panel{background:var(--surface-2);border:1px solid var(--hairline);border-radius:18px;padding:24px;margin-bottom:18px}
.panel h3{font-size:19px;letter-spacing:.02em;margin-bottom:6px}
.quotebox{display:flex;align-items:baseline;gap:12px;margin-top:8px}
.quotebox .amt{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--accent)}

.tl{list-style:none;margin-top:14px}
.tl li{position:relative;padding:0 0 22px 30px}
.tl li::before{content:"";position:absolute;left:5px;top:15px;bottom:-4px;border-left:2px dashed var(--hairline-hi)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--surface-2)}
.tl li .st{font-weight:600;font-size:15px}
.tl li .nt{color:var(--text-mute);font-size:13.5px}
.tl li .ts{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-faint);margin-top:2px}

.seg{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:999px;padding:4px;margin-bottom:22px}
.seg button{border:0;background:transparent;color:var(--text-mute);font:600 13.5px 'IBM Plex Sans',sans-serif;padding:9px 18px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--text)}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.admin-actions select,.admin-actions input{font:400 13.5px 'IBM Plex Sans',sans-serif;color:var(--text);background:var(--surface-2);border:1px solid var(--hairline-hi);border-radius:10px;padding:9px 12px}
.admin-actions input{width:130px}

.spin{width:34px;height:34px;border:3px solid var(--hairline-hi);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-16px);z-index:90;background:var(--elevated-hi);border:1px solid var(--hairline-hi);color:var(--text);padding:13px 22px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-card);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.nav-right a.home{display:none}}
</style>
</head>
<body>
<header class="nav"><div class="nav-inner">
  <a class="brand" href="index.html" aria-label="Omni Cargo home">
    <img src="assets/logos/omni-symbol-white.svg" alt="" width="34" height="34">
    <span class="wm">OMNI<small>CARGO</small></span>
  </a>
  <div class="nav-right">
    <a class="home" href="index.html">← Back to site</a>
    <a href="#" id="signout" style="display:none">Sign out</a>
  </div>
</div></header>

<main><div class="wrap"><div id="app"><div class="spin"></div></div></div></main>
<div class="toast" id="toast"></div>

<script>
/* Omni Cargo portal — talks to the Apps Script backend via JSONP */
const EXEC = 'https://script.google.com/macros/s/AKfycbynC4sU-uZYWs8JVfoABfAQNaOFt95TCe2wJib6iZtzmkUCldiD9tdrhdswTdRIxAzs1w/exec';

(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const app = $('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const STAGES = ['Booked','Picked Up','In Transit','Arrived Depot','Out for Delivery','Delivered','Cancelled'];

  const getCode = () => { try { return sessionStorage.getItem('oc_code') || ''; } catch(_) { return ''; } };
  const getRole = () => { try { return sessionStorage.getItem('oc_role') || ''; } catch(_) { return ''; } };
  const getName = () => { try { return sessionStorage.getItem('oc_name') || ''; } catch(_) { return ''; } };
  const setSession = (code, role, name) => { try { sessionStorage.setItem('oc_code', code); sessionStorage.setItem('oc_role', role); sessionStorage.setItem('oc_name', name || ''); } catch(_){} };
  const clearSession = () => { try { sessionStorage.clear(); } catch(_){} };

  /* Talks to the Apps Script backend via a plain CORS fetch.
     (The endpoint returns Access-Control-Allow-Origin:* so this works cross-origin.
      JSONP is avoided because Apps Script serves the callback as application/json + nosniff,
      which browsers refuse to execute as a script.) */
  function api(params) {
    const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    return fetch(EXEC + '?' + qs, { method: 'GET', signal: ctrl.signal })
      .then(r => { if (!r.ok) throw new Error('Server error (' + r.status + '). Please try again.'); return r.json(); })
      .catch(e => { throw new Error(e && e.name === 'AbortError' ? 'Timed out — please try again.' : 'Network error. Please check your connection and try again.'); })
      .finally(() => clearTimeout(timer));
  }

  let toastT;
  function toast(msg, ok) { const el = $('toast'); el.textContent = msg; el.className = 'toast show' + (ok ? '' : ''); el.style.borderColor = ok ? 'rgba(37,211,102,.5)' : 'rgba(255,107,26,.5)'; clearTimeout(toastT); toastT = setTimeout(() => el.className = 'toast', 3600); }

  const chipCls = s => ({ 'Booked':'c-booked','Picked Up':'c-move','In Transit':'c-move','Arrived Depot':'c-soft','Out for Delivery':'c-soft','Delivered':'c-done','Cancelled':'c-cancel' }[s] || 'c-booked');
  const chip = s => `<span class="chip ${chipCls(s)}">${esc(s||'Booked')}</span>`;
  const rl = r => ({ msa_nbo:'Mombasa → Nairobi', nbo_msa:'Nairobi → Mombasa', intra_nbo:'Within Nairobi' }[r] || (r || '—'));
  const quoteText = j => (j.quote ? 'KES ' + Number(j.quote).toLocaleString() : (j.quoteStatus === 'Sent' ? 'Sent — awaiting price' : 'Being prepared'));

  /* ---------- router ---------- */
  const S = { view: 'login', jobs: [], sel: null, adminTab: 'jobs' };
  function render() {
    $('signout').style.display = getCode() ? '' : 'none';
    if (!getCode()) return renderLogin();
    if (S.sel) return renderDetail();
    if (getRole() === 'admin') return renderAdmin();
    return renderCustomer();
  }

  /* ---------- login ---------- */
  function renderLogin() {
    app.innerHTML = `<div class="auth">
      <div class="eyebrow">Customer &amp; admin portal</div>
      <h1>Track your <em>cargo.</em></h1>
      <p class="sub">Enter the access code from your booking confirmation. (Staff use the Omni Cargo admin code.)</p>
      <label class="f-label" for="code">Access code</label>
      <input id="code" class="f-in code" placeholder="••••••••" autocomplete="one-time-code" spellcheck="false" maxlength="40">
      <div class="err" id="lerr"></div>
      <div style="margin-top:22px"><button class="btn btn-primary" id="go" style="width:100%">Sign in</button></div>
      <p class="hint">No code yet? <a href="book.html" style="color:var(--accent)">Make a booking</a> — your code arrives by email.</p>
    </div>`;
    const input = $('code'), btn = $('go'), err = $('lerr');
    input.focus();
    const submit = async () => {
      const code = input.value.trim(); if (!code) return;
      btn.disabled = true; btn.textContent = 'Signing in…'; err.style.display = 'none';
      try {
        const r = await api({ action: 'login', code });
        if (r.error) throw new Error(r.error);
        setSession(r.role === 'admin' ? code : (r.code || code), r.role, r.name);
        S.sel = null; await loadHome(); render();
      } catch (e) { err.textContent = e.message; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Sign in'; }
    };
    btn.onclick = submit;
    input.onkeydown = e => { if (e.key === 'Enter') submit(); };
  }

  async function loadHome() {
    try {
      if (getRole() === 'admin') { const r = await api({ action: 'adminAll', code: getCode() }); S.jobs = r.jobs || []; }
      else { const r = await api({ action: 'myBookings', code: getCode() }); S.jobs = r.jobs || []; }
    } catch (_) { S.jobs = []; }
  }

  function jobCard(j) {
    return `<div class="card job" data-ref="${esc(j.ref)}">
      <div class="top"><span class="ref">${esc(j.ref)}</span>${chip(j.status)}</div>
      <div class="rt">${esc(rl(j.route))}</div>
      <div class="meta"><span>${esc(j.pickup||'—')} → ${esc(j.delivery||'—')}</span><span class="m">${esc((j.created||'').split(' ')[0])}</span></div>
    </div>`;
  }
  function bindJobs(scope) { scope.querySelectorAll('[data-ref]').forEach(el => el.onclick = () => openDetail(el.dataset.ref)); }

  /* ---------- customer ---------- */
  function renderCustomer() {
    const active = S.jobs.filter(j => j.status !== 'Delivered' && j.status !== 'Cancelled').length;
    app.innerHTML = `<div class="head"><div><div class="who">Welcome · ${esc(getName()||'Customer')}</div><h1>Your bookings</h1></div></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px">
        <div class="card"><div style="font:800 40px 'Big Shoulders'">${S.jobs.length}</div><div class="mono" style="font-size:11px;letter-spacing:.16em;color:var(--text-mute);text-transform:uppercase">Total</div></div>
        <div class="card"><div style="font:800 40px 'Big Shoulders'">${active}</div><div class="mono" style="font-size:11px;letter-spacing:.16em;color:var(--text-mute);text-transform:uppercase">In progress</div></div>
      </div>
      <div class="grid" id="list"></div>`;
    const list = $('list');
    if (!S.jobs.length) { list.innerHTML = `<div class="empty">No bookings yet. Once you book, it appears here.</div>`; return; }
    list.innerHTML = S.jobs.map(jobCard).join('');
    bindJobs(list);
  }

  /* ---------- detail ---------- */
  async function openDetail(ref) { S.sel = { loading: true, ref }; render(); try { const r = await api({ action: 'detail', code: getCode(), ref }); S.sel = r; render(); } catch (e) { toast(e.message); S.sel = null; render(); } }
  function renderDetail() {
    if (S.sel.loading) { app.innerHTML = `<button class="back" id="bk">← Back</button><div class="spin"></div>`; $('bk').onclick = () => { S.sel = null; render(); }; return; }
    if (S.sel.error) { app.innerHTML = `<button class="back" id="bk">← Back</button><div class="empty">${esc(S.sel.error)}</div>`; $('bk').onclick = () => { S.sel = null; render(); }; return; }
    const j = S.sel.job, tl = (S.sel.timeline || []).slice().reverse(), isAdmin = getRole() === 'admin';
    app.innerHTML = `<button class="back" id="bk">← Back</button>
      <div class="hero">
        <div class="ref">${esc(j.ref)}</div>
        <div class="route">${esc(rl(j.route))}</div>
        ${chip(j.status)}
        <div class="kv">
          <div><span>From</span><b>${esc(j.pickup||'—')}</b></div>
          <div><span>To</span><b>${esc(j.delivery||'—')}</b></div>
          <div><span>Cargo</span><b>${esc(j.cargo||'—')}</b></div>
          <div><span>Weight</span><b>${esc(j.weight||'—')}</b></div>
          ${j.volume?`<div><span>Volume</span><b>${esc(j.volume)} m³</b></div>`:''}
          ${j.pieces?`<div><span>Pieces</span><b>${esc(j.pieces)}</b></div>`:''}
        </div>
      </div>
      <div class="panel"><h3>Your quote</h3>
        <div class="quotebox">${j.quote?`<span class="amt">KES ${esc(Number(j.quote).toLocaleString())}</span>`:`<span style="color:var(--text-mute)">${esc(quoteText(j))}</span>`}${j.quote?chip('quoted').replace('c-booked','c-quote').replace('quoted','Quoted'):''}</div>
        ${isAdmin?`<div class="admin-actions"><input id="qamt" type="number" placeholder="Amount (KES)" value="${j.quote||''}"><button class="btn btn-ghost btn-sm" id="setq">Set quote</button></div>`:''}
      </div>
      <div class="panel"><h3>Progress</h3>
        <ul class="tl">${tl.length?tl.map(t=>`<li><div class="st">${esc(t.Status)}</div>${t.Note?`<div class="nt">${esc(t.Note)}</div>`:''}<div class="ts">${esc(t.At)}</div></li>`).join(''):'<li><div class="st">Booked</div><div class="ts">—</div></li>'}</ul>
        ${isAdmin?`<div class="admin-actions"><select id="stsel">${STAGES.map(s=>`<option${s===j.status?' selected':''}>${s}</option>`).join('')}</select><input id="stnote" placeholder="Note (optional)" style="width:180px"><button class="btn btn-primary btn-sm" id="setst">Update status</button></div>`:''}
      </div>`;
    $('bk').onclick = () => { S.sel = null; render(); };
    if (isAdmin) {
      $('setst').onclick = async () => {
        try { await api({ action: 'setStatus', code: getCode(), ref: j.ref, status: $('stsel').value, note: $('stnote').value }); toast('Status updated.', 1); await openDetail(j.ref); } catch (e) { toast(e.message); }
      };
      $('setq').onclick = async () => {
        const amt = $('qamt').value.trim(); if (!amt) return toast('Enter an amount.');
        try { await api({ action: 'setQuote', code: getCode(), ref: j.ref, amount: amt }); toast('Quote sent to customer.', 1); await openDetail(j.ref); } catch (e) { toast(e.message); }
      };
    }
  }

  /* ---------- admin ---------- */
  function renderAdmin() {
    const pending = S.jobs.filter(j => (j.quoteStatus||'') === 'Pending' || !j.quote).length;
    app.innerHTML = `<div class="head"><div><div class="who">Admin · ${esc(getName()||'')}</div><h1>Dispatch</h1></div></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px">
        <div class="card"><div style="font:800 40px 'Big Shoulders'">${S.jobs.length}</div><div class="mono" style="font-size:11px;letter-spacing:.16em;color:var(--text-mute);text-transform:uppercase">All jobs</div></div>
        <div class="card"><div style="font:800 40px 'Big Shoulders'">${pending}</div><div class="mono" style="font-size:11px;letter-spacing:.16em;color:var(--text-mute);text-transform:uppercase">Need a quote</div></div>
      </div>
      <div class="grid" id="list"></div>`;
    const list = $('list');
    if (!S.jobs.length) { list.innerHTML = `<div class="empty">No bookings yet.</div>`; return; }
    const sorted = S.jobs.slice().sort((a,b)=>String(b.created).localeCompare(String(a.created)));
    list.innerHTML = sorted.map(j => `<div class="card job" data-ref="${esc(j.ref)}">
      <div class="top"><span class="ref">${esc(j.ref)} · ${esc(j.type||'')}</span>${chip(j.status)}</div>
      <div class="rt">${esc(j.name||'—')} — ${esc(rl(j.route))}</div>
      <div class="meta"><span>${esc(j.phone||'')}</span><span>${esc(j.cargo||'')}</span><span class="m">${j.quote?'KES '+Number(j.quote).toLocaleString():esc(quoteText(j))}</span></div>
    </div>`).join('');
    bindJobs(list);
  }

  $('signout').onclick = e => { e.preventDefault(); clearSession(); S.sel = null; S.jobs = []; render(); };

  /* boot */
  (async () => { if (getCode()) { await loadHome(); } render(); })();
})();
</script>
</body>
</html>
