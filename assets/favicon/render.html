<!DOCTYPE html>
<html>

<body>

    <path d="M 20 41.5 C 31 49.5, 46 19.5, 53 12" stroke="#FF6B1A" stroke-width="7" stroke-linecap="round"/>
    <path d="M 59 6 L 57 15.2 L 49.8 8 Z" fill="#FF6B1A"/>

</div>
<script>
  if (new URLSearchParams(location.search).get('mode') === 'rounded') document.body.classList.add('rounded');
</script>
</body>
</html>
