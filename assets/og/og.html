<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,800;10..72,900&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      radial-gradient(ellipse 900px 500px at 85% -10%, rgba(255,107,26,.14), transparent 60%),
      radial-gradient(ellipse 700px 600px at -5% 110%, rgba(20,42,68,.9), transparent 65%),
      linear-gradient(160deg, #0F2035 0%, #0A1626 55%, #081020 100%);
    font-family:'IBM Plex Sans',sans-serif;color:#EEF3F9}
  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none}
  .route{position:absolute;right:-140px;top:-160px;width:760px;height:760px;opacity:.16}
  .content{position:absolute;left:90px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center;z-index:2}
  .lockup{display:flex;align-items:center;gap:26px;margin-bottom:46px}
  .lockup svg{width:96px;height:96px}
  .wm{font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:64px;letter-spacing:.01em;line-height:.95}
  .wm small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:24px;letter-spacing:.4em;color:#8CA3BC;margin-top:6px}
  h1{font-family:'Big Shoulders',sans-serif;font-weight:900;font-size:118px;line-height:.92;letter-spacing:-.005em;text-transform:uppercase;max-width:900px}
  h1 em{font-style:normal;color:#FF6B1A}
  .sub{margin-top:34px;font-family:'IBM Plex Mono',monospace;font-size:25px;letter-spacing:.14em;color:#8CA3BC}
  .sub b{color:#FF6B1A;font-weight:500}
</style>
</head>
<body>
  <svg class="route" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 52.67 24.48 A 22 22 0 1 1 39.52 11.33" stroke="#EEF3F9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 20 41.5 C 31 49.5, 46 19.5, 53 12" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 58.1 6.9 L 56.5 14.5 L 50.5 8.5 Z" fill="#FF6B1A"/>
  </svg>
  <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="content">
    <div class="lockup">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 52.67 24.48 A 22 22 0 1 1 39.52 11.33" stroke="#EEF3F9" stroke-width="6" stroke-linecap="round"/>
        <path d="M 20 41.5 C 31 49.5, 46 19.5, 53 12" stroke="#FF6B1A" stroke-width="6" stroke-linecap="round"/>
        <path d="M 58.1 6.9 L 56.5 14.5 L 50.5 8.5 Z" fill="#FF6B1A"/>
      </svg>
      <div class="wm">OMNI<small>CARGO</small></div>
    </div>
    <h1>Mombasa ↔ Nairobi. <em>Moved.</em></h1>
    <div class="sub">FAST · SECURE · TRACKED — <b>omnicargo.co.ke</b></div>
  </div>
</body>
</html>
